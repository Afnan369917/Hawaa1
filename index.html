اكتشفي أحدث صيحات الموضة، نصائح العناية بالبشرة والشعر، وأفكارًا ملهمة تضيف لمسة مميزة إلى يومكِ بكل حب وتألق✨

<Center>
<img src="Imag.png" alt="insert" width="300px" style="border-radius:20px;">
<br> <br>
<button class="tip-btn" id="dailyTip">
  💡 اضغطي لعرض نصيحة اليوم
</button>

<script>
const tips = [
  "اشربي ماء كثير يوميًا 🌸",
  "نامي 8 ساعات لصحة أفضل ✨",
  "اعتني ببشرتك يوميًا 💖",
  "لا تنسي إزالة المكياج قبل النوم 🧴",
  "استخدمي واقي الشمس ☀️"
];

let today = new Date().getDate();
let index = today % tips.length;

let tip = tips[index];

let button = document.getElementById("dailyTip");

button.onclick = function() {
  // عرض النصيحة
  button.innerText = tip;

  // بعد دقيقة يرجع للنص الأصلي
  setTimeout(function() {
    button.innerText = "💡 نصيحة اليوم";
  }, 60000); // 60000 = دقيقة كاملة
};
</script>
