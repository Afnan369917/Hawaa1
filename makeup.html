<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>مكياج  </title>
  <link rel="stylesheet" href="style.css">
<style>
  body {
  margin: 0;
  font-family: Arial, sans-serif;
  background-color: #ffeef5;
}
.hero {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  color: #c94f7c;
}
.hero h1 {
  font-size: 40px;
  margin: 0;
}
.hero p {
  font-size: 18px;
  margin: 10px 0;
}
.hero button {
  padding: 10px 20px;
  border: none;
  border-radius: 20px;
  cursor: pointer;
}
  button {
  background-color: #c94f7c;
  color: white;
  padding: 10px 20px;
  border: none;
  border-radius: 20px;
  cursor: pointer;
}
.buttons {
  display: flex;
  justify-content: center;
  gap : 15px;
}
#recipe {
  margin-top:30px;
  width: 80%;
  max-width: 700px;
  text-align: right;
}
</style>
</head>
<body> 
<section class="hero">
  <h2>أسرار المكياج 💄  </h2>
  <p>
    🌸 "لكل امرأة جمالها الخاص، والمكياج هو وسيلة لإبراز هذا الجمال بأسلوب أنيق وناعم. استمتعي باكتشاف أسرار الإطلالات الرائعة معنا."
    <div class= "buttons">
      <button onclick="showrecipe ('tools')">أدوات المكياج الأساسيه </button>
      <button onclick = "showrecipe('steps')"> خطوات المكياج  </button>
      <button onclick ="showrecipe('types')">أنواع المكياج</button>
    </div>
    <div id = "recipe"></div>
  </p>
</section>
</body>
